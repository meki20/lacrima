# `docker compose up -d`                 → just Suwayomi, for `npm run dev`.
# `docker compose --profile serve up -d` → the whole thing behind Caddy.
services:
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:stable
    container_name: lacrima-suwayomi
    restart: unless-stopped
    ports:
      - "4567:4567"
    volumes:
      - suwayomi:/home/suwayomi/.local/share/Tachidesk
    environment:
      TZ: Europe/Berlin

  lacrima:
    profiles: ["serve"]
    build: .
    container_name: lacrima
    restart: unless-stopped
    depends_on:
      - suwayomi
    volumes:
      # Same SQLite as `npm run dev`. A named volume hid existing anime addons from the phone.
      - ./data:/data
    environment:
      TZ: Europe/Berlin
      # Also the proxy allowlist: /api/proxy only relays to this host.
      SUWAYOMI_URL: http://suwayomi:4567
      LACRIMA_DB: /data/lacrima.db
      # Decoder fallbacks become 8-bit H.264 with the RTX instead of CPU x264.
      LACRIMA_H264_ENCODER: ${LACRIMA_H264_ENCODER:-h264_nvenc}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      # LACRIMA_LANGS: en,all
    gpus: all

  caddy:
    profiles: ["serve"]
    image: caddy:2-alpine
    container_name: lacrima-caddy
    restart: unless-stopped
    depends_on:
      - lacrima
    ports:
      - "7345:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  suwayomi:
  caddy-data:
  caddy-config:
